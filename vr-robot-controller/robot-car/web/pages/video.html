<!DOCTYPE html>
<!--
  video.html - the plain video page: just the live camera, full window.

  Served by:  camera_server.py at  http://PI_IP:8000/
  Opened on:  any browser on the same Wi-Fi (laptop, phone, Quest)
  Code:       ../css/video.css (look), ../js/video.js (link + full screen)

  The <img src="/stream"> line is the whole video player: the browser keeps
  showing each new picture the /stream address sends (MJPEG).
-->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pi Car Camera</title>
  <link rel="stylesheet" href="/css/video.css">
</head>
<body>
  <img src="/stream" alt="If this stays blank, check the camera_server.py window on the Pi">
  <div class="bar">Tap the video for full screen &middot;
    Quest mixed reality: <a id="xr"></a></div>
  <script src="/js/video.js"></script>
</body>
</html>
