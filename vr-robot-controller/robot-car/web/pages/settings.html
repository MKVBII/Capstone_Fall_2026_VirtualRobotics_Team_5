<!DOCTYPE html>
<!--
  settings.html - every setting, on a laptop or in the Quest browser.

  Served by:  camera_server.py at  /settings
  Code:       ../css/site.css (look), ../js/settings-page.js (builds the form
              from the list in ../js/settings.js)
  Saved on the Pi (settings.json), so the headset's settings panel shows the
  same values. Only "Web pages: light / dark" is saved per device.
-->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings - VR Robot Controller</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/site.css">
  <style>
    .card-list { list-style: none; margin: 0; padding: 0; }
    .card-list li { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .card-list li span { flex: 1; }
    .card-list button { min-height: 40px; min-width: 44px; }
    .saved { transition: opacity .3s; }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">VR Robot Controller</a>
    <nav>
      <a href="/">Start</a>
      <a href="/begin">Drive</a>
      <a href="/settings" aria-current="page">Settings</a>
      <a href="/spectator">Spectator</a>
      <a href="/about">About</a>
    </nav>
    <button class="theme-toggle" type="button"></button>
  </header>

  <main class="container stack">
    <div class="row" style="justify-content: space-between">
      <div>
        <h1>Settings</h1>
        <p class="muted">Saved on the robot's Pi, so the headset uses them too. In the headset, the
           same settings are behind the gear button under the video.</p>
      </div>
      <span class="pill saved" id="saved" style="opacity:0"><span class="dot ok"></span>Saved</span>
    </div>

    <section class="card">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div id="panel"></div>
    </section>

    <section class="card">
      <h2>This device</h2>
      <div class="setting">
        <label for="page-theme">Web pages: light / dark
          <span class="hint">Saved on this device only, so the laptop and the headset can differ.</span></label>
        <select id="page-theme">
          <option value="auto">Follow this device</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
    </section>

    <div class="row">
      <button class="btn danger" id="reset" type="button">Reset to defaults</button>
    </div>
  </main>

  <script type="module" src="/js/settings-page.js"></script>
</body>
</html>
